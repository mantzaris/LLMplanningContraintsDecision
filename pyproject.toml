[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plancheck"
version = "0.1.0"
description = "Decision-relevant semantic validation for finite public-transport planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["pydantic==2.11.7", "z3-solver==4.15.3.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12"]
analysis = ["matplotlib==3.10.6"]
gpu = ["torch==2.8.0", "transformers==4.51.3", "huggingface-hub==0.33.4"]

[project.scripts]
plancheck = "plancheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
